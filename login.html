<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Retirement Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { navy: { 900: '#001529', 800: '#001f3f', 700: '#002b55', 600: '#003366' } } } } }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-navy-800 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-navy-900 p-10 rounded-[2.5rem] shadow-2xl border border-navy-600">
        <div class="text-center mb-8">
            <div class="bg-blue-600 w-20 h-20 rounded-3xl flex items-center justify-center text-4xl mx-auto mb-6 shadow-lg shadow-blue-900/50">💼</div>
            <h1 class="text-3xl font-black text-white uppercase tracking-widest">Retirement <span class="text-blue-400 font-light">Hub</span></h1>
            <p class="text-gray-400 text-sm mt-3 font-bold">بوابة الإدارة المالية الآمنة</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-6">
            <div>
                <label class="block text-blue-300 text-xs font-black mb-2 pr-1 uppercase">اسم المستخدم</label>
                <input id="username" type="text" placeholder="اسم المستخدم" class="w-full bg-navy-800 text-white border border-navy-600 rounded-2xl py-4 px-5 focus:border-blue-500 outline-none shadow-inner font-bold" required>
            </div>
            <div>
                <label class="block text-blue-300 text-xs font-black mb-2 pr-1 uppercase">كلمة المرور</label>
                <input id="password" type="password" placeholder="••••••••" class="w-full bg-navy-800 text-white border border-navy-600 rounded-2xl py-4 px-5 focus:border-blue-500 outline-none shadow-inner font-bold" required>
            </div>
            <div id="error-msg" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-xl text-xs text-center font-black italic">⚠️ البيانات غير صحيحة!</div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl transition-all shadow-lg active:scale-95 text-lg">دخول النظام الآمن 🔐</button>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            
            if (user === 'radwan aljohani' && pass === '1117473137') {
                // حفظ حالة الدخول في ذاكرة المتصفح المؤقتة
                sessionStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'index.html'; // الانتقال للرئيسية
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
