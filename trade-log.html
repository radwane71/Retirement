<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل العمليات الاحترافي - Retirement Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="assets/data/tickers.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#001529', 800: '#001f3f', 700: '#002b55', 600: '#003366' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #001f3f; color: #f3f4f6; }
        
        /* تحسين استايل الحقول ليكون النص واضحاً جداً (Premium Style) */
        .input-premium { 
            @apply bg-navy-800 border border-navy-600 rounded-2xl p-4 text-base text-white w-full transition-all duration-300 font-bold;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .input-premium:focus { 
            @apply border-blue-500 bg-navy-700 ring-4 ring-blue-500/10 outline-none;
        }
        .field-label { @apply text-xs font-black text-blue-400 mb-2 flex items-center gap-2 pr-1 uppercase tracking-widest; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #003366; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

    <nav class="bg-navy-900 border-b border-navy-600 p-4 mb-8 flex flex-col md:flex-row justify-between items-center rounded-2xl shadow-2xl">
        <div class="flex items-center gap-3 mb-4 md:mb-0">
            <div class="bg-blue-600 p-2 rounded-lg text-xl shadow-lg">💼</div>
            <h1 class="text-2xl font-bold text-white uppercase tracking-wider">Retirement <span class="text-blue-400 font-light text-lg">Hub</span></h1>
        </div>
        <div class="flex flex-wrap justify-center gap-4 text-sm font-medium">
            <a href="index.html" class="px-4 py-2 hover:text-blue-400 transition">الرئيسية 🏠</a>
            <a href="trade-log.html" class="px-4 py-2 text-blue-400 border-b-2 border-blue-400 pb-1">سجل التداول 📝</a>
            <a href="dividends.html" class="px-4 py-2 hover:text-blue-400 transition">التوزيعات 💵</a>
            <a href="investment-roadmap.html" class="px-4 py-2 hover:text-blue-400 transition">خارطة الطريق 🗺️</a>
        </div>
    </nav>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <div class="bg-navy-700 p-6 rounded-3xl border border-navy-600 shadow-xl">
            <span class="text-blue-300 text-xs font-bold uppercase tracking-widest">إجمالي العمولات 🧾</span>
            <div class="text-3xl font-black text-white mt-1"><span id="stat-commission">0.00</span> <span class="text-xs text-gray-400 font-light">ر.س</span></div>
        </div>
        <div class="bg-navy-700 p-6 rounded-3xl border border-navy-600 shadow-xl">
            <span class="text-amber-400 text-xs font-bold uppercase tracking-widest">إجمالي الضريبة (VAT) 🏛️</span>
            <div class="text-3xl font-black text-amber-500 mt-1"><span id="stat-vat">0.00</span> <span class="text-xs text-gray-400 font-light">ر.س</span></div>
        </div>
        <div class="col-span-1 md:col-span-2 bg-navy-700 p-6 rounded-3xl border border-navy-600 shadow-xl">
            <span class="text-green-400 text-xs font-bold uppercase block text-center mb-2 tracking-widest">حجم التداولات المنفذة 📊</span>
            <div class="h-16 w-full"><canvas id="miniChart"></canvas></div>
        </div>
    </div>

    <div class="bg-navy-900 border border-navy-600 rounded-[2.5rem] shadow-2xl overflow-hidden mb-12">
        <div class="bg-gradient-to-r from-navy-700 to-navy-800 p-6 border-b border-navy-600 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600/20 p-3 rounded-2xl text-blue-400 text-2xl shadow-inner">📝</div>
                <div>
                    <h2 class="font-black text-xl text-white">إضافة عملية تداول جديدة</h2>
                    <p class="text-[10px] text-blue-300/60 font-bold uppercase tracking-[0.2em]">TRADE ENTRY TERMINAL</p>
                </div>
            </div>
            <div class="hidden md:block">
                <span class="text-[10px] bg-navy-800 px-4 py-2 rounded-full border border-navy-600 text-gray-400 font-bold uppercase tracking-widest">Real-time Processing</span>
            </div>
        </div>

        <div class="p-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                <div>
                    <label class="field-label">🆔 كود السهم (Ticker)</label>
                    <input type="text" id="tickerInput" placeholder="مثلاً: 2222" class="input-premium">
                </div>
                <div>
                    <label class="field-label">🏷️ نوع العملية</label>
                    <select id="typeInput" class="input-premium appearance-none cursor-pointer">
                        <option value="Buy" class="bg-navy-900 text-green-400">شراء 🟢</option>
                        <option value="Sell" class="bg-navy-900 text-red-400">بيع 🔴</option>
                    </select>
                </div>
                <div>
                    <label class="field-label">🔢 الكمية (Quantity)</label>
                    <input type="number" id="qtyInput" placeholder="0" class="input-premium">
                </div>
                <div>
                    <label class="field-label">💰 سعر الوحدة</label>
                    <input type="number" id="priceInput" step="0.01" placeholder="0.00" class="input-premium">
                </div>
            </div>

            <div class="mt-10">
                <button onclick="addTrade()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-5 rounded-[1.5rem] shadow-[0_10px_30px_-10px_rgba(37,99,235,0.5)] transition-all duration-300 transform active:scale-[0.97] flex items-center justify-center gap-3 text-lg">
                    تنفيذ وإضافة العملية للسجل ➕
                </button>
            </div>
        </div>
    </div>

    <div class="bg-navy-900 border border-navy-600 rounded-[2rem] shadow-2xl overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-right text-sm">
                <thead>
                    <tr class="bg-navy-700 text-blue-300 border-b border-navy-600 uppercase font-black tracking-widest">
                        <th class="p-5">التاريخ</th>
                        <th class="p-5">الكود</th>
                        <th class="p-5">الشركة</th>
                        <th class="p-5">الحالة</th>
                        <th class="p-5">الكمية</th>
                        <th class="p-5">السعر</th>
                        <th class="p-5">التكلفة الإجمالية</th>
                        <th class="p-5 text-center">إجراءات</th>
                    </tr>
                </thead>
                <tbody id="tradeTableBody" class="divide-y divide-navy-600 font-medium text-xs">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // المنطق البرمجي (بقي كما هو لضمان عمل الصفحة 100%)
        let trades = JSON.parse(localStorage.getItem('myTrades')) || [];

        const calculateFees = (qty, price) => {
            const total = qty * price;
            const commission = Math.max(total * 0.00155, 12); 
            const vat = commission * 0.15; 
            return { commission, vat };
        }

        const renderTrades = () => {
            const tableBody = document.getElementById('tradeTableBody');
            tableBody.innerHTML = '';
            let totalComm = 0;
            let totalVat = 0;

            trades.forEach((trade, index) => {
                const company = tickersMap[trade.ticker] || { name: "غير مسجل", sector: "غير محدد" };
                const fees = calculateFees(trade.qty, trade.price);
                const totalCost = (trade.qty * trade.price) + (trade.type === 'Buy' ? (fees.commission + fees.vat) : -(fees.commission + fees.vat));
                
                totalComm += fees.commission;
                totalVat += fees.vat;

                tableBody.innerHTML += `
                    <tr class="hover:bg-navy-800 transition-colors">
                        <td class="p-5 text-gray-400 text-[10px] font-mono">${trade.date}</td>
                        <td class="p-5 font-black text-blue-400 tracking-tighter">${trade.ticker}</td>
                        <td class="p-5 text-white font-bold leading-tight">${company.name} <br> <span class="text-[9px] text-gray-500 font-normal uppercase">${company.sector}</span></td>
                        <td class="p-5">
                            <span class="${trade.type === 'Buy' ? 'text-green-400' : 'text-red-400'} font-black text-[10px] uppercase bg-navy-800 px-3 py-1 rounded-full border border-white/5">
                                ${trade.type === 'Buy' ? 'شراء 🟢' : 'بيع 🔴'}
                            </span>
                        </td>
                        <td class="p-5 font-bold">${trade.qty.toLocaleString()}</td>
                        <td class="p-5 font-bold">${trade.price.toFixed(2)}</td>
                        <td class="p-5 font-black text-blue-300 text-sm">${totalCost.toLocaleString(undefined, {minimumFractionDigits:2})}</td>
                        <td class="p-5 text-center">
                            <button onclick="deleteTrade(${index})" class="text-red-500 hover:scale-125 transition-transform">🗑️</button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('stat-commission').innerText = totalComm.toFixed(2);
            document.getElementById('stat-vat').innerText = totalVat.toFixed(2);
            localStorage.setItem('myTrades', JSON.stringify(trades));
            updateChart();
        }

        const addTrade = () => {
            const ticker = document.getElementById('tickerInput').value.trim();
            const qty = parseFloat(document.getElementById('qtyInput').value);
            const price = parseFloat(document.getElementById('priceInput').value);
            const type = document.getElementById('typeInput').value;

            if (!ticker || !qty || !price) {
                alert("يا رضوان، فضلاً تأكد من تعبئة جميع الحقول!");
                return;
            }

            const newTrade = {
                date: new Date().toLocaleString('ar-EG'), 
                ticker,
                qty,
                price,
                type
            };

            trades.unshift(newTrade); 
            renderTrades();
            
            document.getElementById('tickerInput').value = '';
            document.getElementById('qtyInput').value = '';
            document.getElementById('priceInput').value = '';
        }

        const deleteTrade = (index) => {
            if (confirm('هل أنت متأكد من حذف هذه العملية؟')) {
                trades.splice(index, 1);
                renderTrades();
            }
        }

        let myChart;
        const updateChart = () => {
            const ctx = document.getElementById('miniChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: trades.map(t => t.date).reverse(),
                    datasets: [{
                        label: 'حجم العمليات',
                        data: trades.map(t => t.qty * t.price).reverse(),
                        borderColor: '#10b981',
                        borderWidth: 2,
                        fill: true,
                        backgroundColor: 'rgba(16, 185, 129, 0.05)',
                        tension: 0.4,
                        pointRadius: 0
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
            });
        }

        renderTrades();
    </script>
</body>
</html>
