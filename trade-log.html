<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل العمليات الاحترافي - Retirement Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="assets/data/tickers.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#001529', 800: '#001f3f', 700: '#002b55', 600: '#003366' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #001f3f; color: #f3f4f6; }
        .input-style { @apply bg-navy-800 border border-navy-600 rounded-xl p-3 text-sm focus:border-blue-500 outline-none w-full text-white; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

    <nav class="bg-navy-900 border-b border-navy-600 p-4 mb-8 flex flex-col md:flex-row justify-between items-center rounded-2xl shadow-2xl">
        <div class="flex items-center gap-3 mb-4 md:mb-0">
            <div class="bg-blue-600 p-2 rounded-lg text-xl">💼</div>
            <h1 class="text-2xl font-bold text-white uppercase tracking-wider">Retirement <span class="text-blue-400 font-light">Hub</span></h1>
        </div>
        <div class="flex flex-wrap justify-center gap-4 text-sm font-medium">
            <a href="index.html" class="px-4 py-2 hover:text-blue-400 transition">الرئيسية 🏠</a>
            <a href="trade-log.html" class="px-4 py-2 text-blue-400 border-b-2 border-blue-400">سجل التداول 📝</a>
            <a href="dividends.html" class="px-4 py-2 hover:text-blue-400 transition">التوزيعات 💵</a>
        </div>
    </nav>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <div class="bg-navy-700 p-6 rounded-3xl border border-navy-600 shadow-xl">
            <span class="text-blue-300 text-xs font-bold uppercase">إجمالي العمولات 🧾</span>
            <div class="text-3xl font-black text-white mt-1"><span id="stat-commission">0.00</span> <span class="text-xs text-gray-400">ر.س</span></div>
        </div>
        <div class="bg-navy-700 p-6 rounded-3xl border border-navy-600 shadow-xl">
            <span class="text-amber-400 text-xs font-bold uppercase">إجمالي الضريبة (VAT) 🏛️</span>
            <div class="text-3xl font-black text-amber-500 mt-1"><span id="stat-vat">0.00</span> <span class="text-xs text-gray-400">ر.س</span></div>
        </div>
        <div class="col-span-1 md:col-span-2 bg-navy-700 p-6 rounded-3xl border border-navy-600 shadow-xl">
            <span class="text-green-400 text-xs font-bold uppercase block text-center mb-2">حجم التداولات المنفذة 📊</span>
            <div class="h-16 w-full"><canvas id="miniChart"></canvas></div>
        </div>
    </div>

    <div class="bg-navy-900 border border-navy-600 rounded-3xl shadow-2xl overflow-hidden mb-8">
        <div class="bg-navy-700 p-4 border-b border-navy-600 flex justify-between items-center">
            <h2 class="font-bold text-lg flex items-center gap-2">✨ إضافة عملية تداول</h2>
        </div>
        <div class="p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <div>
                <label class="text-xs text-blue-300 block mb-1">كود السهم</label>
                <input type="text" id="tickerInput" placeholder="مثلاً: 2222" class="input-style">
            </div>
            <div>
                <label class="text-xs text-blue-300 block mb-1">النوع</label>
                <select id="typeInput" class="input-style">
                    <option value="Buy">شراء 🟢</option>
                    <option value="Sell">بيع 🔴</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-blue-300 block mb-1">الكمية</label>
                <input type="number" id="qtyInput" placeholder="0" class="input-style">
            </div>
            <div>
                <label class="text-xs text-blue-300 block mb-1">السعر</label>
                <input type="number" id="priceInput" step="0.01" placeholder="0.00" class="input-style">
            </div>
            <div class="pt-5">
                <button onclick="addTrade()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition-transform active:scale-95">إضافة العملية ➕</button>
            </div>
        </div>
    </div>

    <div class="bg-navy-900 border border-navy-600 rounded-3xl shadow-2xl overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-right text-sm">
                <thead>
                    <tr class="bg-navy-700 text-blue-300 border-b border-navy-600">
                        <th class="p-4">التاريخ</th>
                        <th class="p-4">الكود</th>
                        <th class="p-4">الشركة</th>
                        <th class="p-4">الحالة</th>
                        <th class="p-4">الكمية</th>
                        <th class="p-4">السعر</th>
                        <th class="p-4">التكلفة</th>
                        <th class="p-4 text-center">إجراءات</th>
                    </tr>
                </thead>
                <tbody id="tradeTableBody" class="divide-y divide-navy-600">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // تحميل البيانات من LocalStorage أو البدء بمصفوفة فارغة
        let trades = JSON.parse(localStorage.getItem('myTrades')) || [];

        // دالة الحسابات والضرائب (المعايير السعودية)
        const calculateFees = (qty, price) => {
            const total = qty * price;
            const commission = Math.max(total * 0.00155, 12); // مثال: عمولة تداول + البنك (بحد أدنى 12 ريال)
            const vat = commission * 0.15; // ضريبة القيمة المضافة 15% على العمولة
            return { commission, vat };
        }

        const renderTrades = () => {
            const tableBody = document.getElementById('tradeTableBody');
            tableBody.innerHTML = '';
            let totalComm = 0;
            let totalVat = 0;

            trades.forEach((trade, index) => {
                const company = tickersMap[trade.ticker] || { name: "غير مسجل", sector: "غير محدد" };
                const fees = calculateFees(trade.qty, trade.price);
                const totalCost = (trade.qty * trade.price) + (trade.type === 'Buy' ? (fees.commission + fees.vat) : -(fees.commission + fees.vat));
                
                totalComm += fees.commission;
                totalVat += fees.vat;

                tableBody.innerHTML += `
                    <tr class="hover:bg-navy-800 transition">
                        <td class="p-4 text-gray-400 text-[10px] font-mono">${trade.date}</td>
                        <td class="p-4 font-bold text-blue-400">${trade.ticker}</td>
                        <td class="p-4 text-white">${company.name} <br> <span class="text-[9px] text-gray-500">${company.sector}</span></td>
                        <td class="p-4">
                            <span class="${trade.type === 'Buy' ? 'text-green-400' : 'text-red-400'} font-bold text-xs uppercase">
                                ${trade.type === 'Buy' ? 'شراء 🟢' : 'بيع 🔴'}
                            </span>
                        </td>
                        <td class="p-4 font-mono">${trade.qty}</td>
                        <td class="p-4 font-mono">${trade.price}</td>
                        <td class="p-4 font-bold text-blue-300">${totalCost.toLocaleString(undefined, {minimumFractionDigits:2})}</td>
                        <td class="p-4 text-center">
                            <button onclick="deleteTrade(${index})" class="bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white p-2 rounded-lg transition">🗑️ حذف</button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('stat-commission').innerText = totalComm.toFixed(2);
            document.getElementById('stat-vat').innerText = totalVat.toFixed(2);
            localStorage.setItem('myTrades', JSON.stringify(trades));
            updateChart();
        }

        const addTrade = () => {
            const ticker = document.getElementById('tickerInput').value.trim();
            const qty = parseFloat(document.getElementById('qtyInput').value);
            const price = parseFloat(document.getElementById('priceInput').value);
            const type = document.getElementById('typeInput').value;

            if (!ticker || !qty || !price) {
                alert("يا رضوان، فضلاً تأكد من تعبئة جميع الحقول!");
                return;
            }

            const newTrade = {
                date: new Date().toLocaleString('ar-EG'), // التاريخ التلقائي
                ticker,
                qty,
                price,
                type
            };

            trades.unshift(newTrade); // إضافة في البداية
            renderTrades();
            
            // مسح الحقول بعد الإضافة
            document.getElementById('tickerInput').value = '';
            document.getElementById('qtyInput').value = '';
            document.getElementById('priceInput').value = '';
        }

        const deleteTrade = (index) => {
            if (confirm('هل أنت متأكد من حذف هذه العملية بالكامل؟')) {
                trades.splice(index, 1);
                renderTrades();
            }
        }

        let myChart;
        const updateChart = () => {
            const ctx = document.getElementById('miniChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: trades.map(t => t.date).reverse(),
                    datasets: [{
                        label: 'حجم العمليات',
                        data: trades.map(t => t.qty * t.price).reverse(),
                        borderColor: '#10b981',
                        borderWidth: 2,
                        fill: true,
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        tension: 0.4,
                        pointRadius: 0
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
            });
        }

        // التشغيل الأولي
        renderTrades();
    </script>
</body>
</html>
